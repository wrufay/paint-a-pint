<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>what's a pint?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../src/tokens.css">
<!--
  A definition card for screenshots (Devpost, README, socials). Not part of the app.
  Uses the design tokens and the chosen fonts. Screenshot just the card, or the whole page.
-->
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; background: var(--backdrop); }
  body { display: grid; place-items: center; padding: 64px 24px; font-family: var(--font-ui); color: var(--ink);
         background: radial-gradient(ellipse at 50% 30%, #2b2622 0%, var(--backdrop) 70%); min-height: 100vh; }

  .card { position: relative; width: 900px; max-width: 100%; background: var(--cream); border: 6px dashed var(--pink); border-radius: 14px;
          padding: 58px 70px 44px; box-shadow: 0 30px 70px rgba(0, 0, 0, .5); }
  .tape { position: absolute; top: -22px; left: 50%; width: 130px; height: 32px; margin-left: -65px; transform: rotate(-2deg); background: var(--tape-pink);
          clip-path: polygon(0 10%, 4% 0, 8% 12%, 12% 0, 92% 0, 96% 12%, 100% 0, 100% 90%, 96% 100%, 92% 88%, 88% 100%, 8% 100%, 4% 88%, 0 100%); }

  .kicker { display: flex; justify-content: space-between; font-weight: 700; font-size: var(--text-sm); letter-spacing: var(--tracking-caps); text-transform: uppercase; color: var(--ink-soft); }

  .head { display: flex; align-items: flex-end; justify-content: flex-start; gap: 20px; margin-top: 8px; }
  .word { font-family: var(--font-display); font-size: 168px; line-height: 1; color: var(--ink); letter-spacing: -.01em; }
  .say { font-size: 30px; color: var(--ink-soft); margin: 4px 0 0 6px; }
  .glass { width: 270px; height: 270px; object-fit: contain; flex: none; margin: -30px 0 -10px 0; }

  .def { margin-top: 30px; font-size: 29px; line-height: 1.4; }
  .def small { display: block; font-size: 22px; color: var(--ink-soft); margin-top: 4px; }



</style>
</head>
<body>
<article class="card">
  <div class="tape"></div>

  <div class="kicker"><span>definition</span><span>noun</span></div>

  <div class="head">
    <div>
      <div class="word">pint</div>
      <div class="say">/pīnt/</div>
    </div>

    <img class="glass" src="../assets/fabfav-master.png" alt="the paint-a-pint icon: a paint bucket with two brushes">
  </div>

  <p class="def">a unit of measurement for liquid or dry volume that equals one-eighth of a gallon.<small>paint as much as you want, even a pint.</small></p>

</article>
</body>
</html>
